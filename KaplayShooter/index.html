<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Space Shooter - KAPLAY Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 200, 255, 0.2);
            border-radius: 8px;
            max-width: 100vw;
            max-height: 100vh;
        }
        /* Mobile / Touch bar helper */
        #hint {
            position: absolute;
            bottom: 6px;
            color: #8b949e;
            font-size: 11px;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <!-- KAPLAY Local with CDN fallback -->
    <script src="kaplay.js" onerror="this.onerror=null;this.src='https://unpkg.com/kaplay@3001.0.12/dist/kaplay.js';"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="hint">Controls: On-Screen Touch Buttons OR Arrow Keys + Spacebar</div>
    <script src="main.js"></script>
</body>
</html>
